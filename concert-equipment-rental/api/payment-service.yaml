openapi: 3.1.0
info:
  title: payment-service
  version: 1.0.0
  description: Платежи и возвраты аренды.
servers:
  - url: http://localhost:8080
    description: Локальная среда через API Gateway; внутренние пути доступны только внутри сети
tags:
  - name: public
    description: Публичные операции через API Gateway
  - name: internal
    description: Межсервисные операции, недоступные клиенту напрямую
paths:

  /internal/v1/payments:
    post:
      tags: [internal]
      summary: Создать платёж по заказу
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, amount, currency, returnUrl]
              properties:
                bookingId: { type: string }
                amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, example: RUB }
                returnUrl: { type: string, format: uri }
      responses:
        '201':
          description: Платёж создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/payments/provider-callback:
    post:
      tags: [public]
      summary: Callback платёжного провайдера (проверяется подпись провайдера)
      parameters:
        - in: header
          name: X-Provider-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerPaymentId, status, bookingId]
              properties:
                providerPaymentId: { type: string }
                bookingId: { type: string }
                status: { type: string, enum: [SUCCEEDED, DECLINED] }
      responses:
        '202': { description: Callback принят; результат будет опубликован событием }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/v1/refunds:
    post:
      tags: [internal]
      summary: Инициировать возврат (компенсация саги)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, reason]
              properties:
                paymentId: { type: string }
                reason: { type: string }
      responses:
        '202': { description: Возврат принят в обработку }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Повторный запрос с тем же ключом возвращает первоначальный результат.
      schema: { type: string, minLength: 8, maxLength: 128 }
    EquipmentId:
      in: path
      name: equipmentId
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не прошла аутентификация
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Конфликт состояния или повторная операция
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Бизнес-валидация не пройдена
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Payment:
      type: object
      required: [paymentId, bookingId, status, amount, currency]
      properties:
        paymentId: { type: string }
        bookingId: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED] }
        amount: { type: number, format: double }
        currency: { type: string }
        paymentUrl: { type: string, format: uri }


    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri, example: "https://api.example.com/problems/validation" }
        title: { type: string, example: "Business rule violation" }
        status: { type: integer, example: 409 }
        detail: { type: string, example: "Запрошенное количество оборудования недоступно на выбранный период." }
        instance: { type: string, example: "/api/v1/bookings" }
        traceId: { type: string, example: "00-abc123-def456-01" }

