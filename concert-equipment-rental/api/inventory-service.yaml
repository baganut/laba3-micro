openapi: 3.1.0
info:
  title: inventory-service
  version: 1.0.0
  description: Физические единицы оборудования и их резервирование.
servers:
  - url: http://localhost:8080
    description: Локальная среда через API Gateway; внутренние пути доступны только внутри сети
tags:
  - name: public
    description: Публичные операции через API Gateway
  - name: internal
    description: Межсервисные операции, недоступные клиенту напрямую
paths:

  /internal/v1/availability:
    get:
      tags: [internal]
      summary: Проверить доступность оборудования на период
      parameters:
        - in: query
          name: equipmentId
          required: true
          schema: { type: string }
        - in: query
          name: startAt
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: endAt
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: quantity
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
              example: { equipmentId: "eq-101", requested: 4, available: 6, canReserve: true }
        '400': { $ref: '#/components/responses/BadRequest' }
  /internal/v1/reservations:
    post:
      tags: [internal]
      summary: Зарезервировать физические единицы на период
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
            example: { bookingId: "bkg-1001", items: [{ equipmentId: "eq-101", quantity: 4 }], startAt: "2026-12-10T10:00:00Z", endAt: "2026-12-12T22:00:00Z", expiresAt: "2026-11-07T09:00:00Z" }
      responses:
        '201':
          description: Резерв создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/reservations/{reservationId}:
    delete:
      tags: [internal]
      summary: Освободить резерв (компенсирующее действие)
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Резерв освобождён или уже отсутствует }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Повторный запрос с тем же ключом возвращает первоначальный результат.
      schema: { type: string, minLength: 8, maxLength: 128 }
    EquipmentId:
      in: path
      name: equipmentId
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не прошла аутентификация
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Конфликт состояния или повторная операция
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Бизнес-валидация не пройдена
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Availability:
      type: object
      required: [equipmentId, requested, available, canReserve]
      properties:
        equipmentId: { type: string }
        requested: { type: integer }
        available: { type: integer }
        canReserve: { type: boolean }
    ReserveRequest:
      type: object
      required: [bookingId, items, startAt, endAt, expiresAt]
      properties:
        bookingId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [equipmentId, quantity]
            properties:
              equipmentId: { type: string }
              quantity: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Reservation:
      type: object
      required: [reservationId, bookingId, status, expiresAt]
      properties:
        reservationId: { type: string }
        bookingId: { type: string }
        status: { type: string, enum: [HELD, RELEASED, EXPIRED, COMMITTED] }
        expiresAt: { type: string, format: date-time }


    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri, example: "https://api.example.com/problems/validation" }
        title: { type: string, example: "Business rule violation" }
        status: { type: integer, example: 409 }
        detail: { type: string, example: "Запрошенное количество оборудования недоступно на выбранный период." }
        instance: { type: string, example: "/api/v1/bookings" }
        traceId: { type: string, example: "00-abc123-def456-01" }

